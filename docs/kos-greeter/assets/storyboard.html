<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KOS Greeter 概念分镜</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1521;color:#eef6ff;font-family:system-ui,sans-serif}header{padding:22px}h1{font-size:23px;margin:0 0 10px}p{margin:8px 0;color:#bdcbe0}nav{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 20px}button{background:#254564;color:white;border:1px solid #6495c7;border-radius:9px;padding:10px;cursor:pointer}button.active{background:#0b70b9}.screen{position:relative;margin:0 22px;aspect-ratio:16/10;max-height:75vh;overflow:hidden;border-radius:15px;background:linear-gradient(130deg,#155a99,#738aca 45%,#d69696);background-image:linear-gradient(#10234033,#10234033),url(kos-wallpaper-sample.png);background-size:cover;background-position:center}.date,.time{text-align:center;position:absolute;left:0;right:0;text-shadow:0 2px 15px #001a4266}.date{top:7%;font-size:clamp(13px,2vw,26px)}.time{top:11%;font-size:clamp(55px,11vw,150px);font-weight:300;color:#ffffffcc;letter-spacing:-.06em}.user{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);text-align:center;width:300px}.avatar{width:66px;height:66px;border-radius:50%;margin:auto;background:linear-gradient(40deg,#e4915b,#eadcc8);display:grid;place-items:center;font-size:28px;box-shadow:0 1px 10px #0003}.name{margin:9px 0}.password{background:#ffffff38;border:1px solid #ffffff66;border-radius:20px;padding:9px;width:215px;margin:12px auto;font-size:13px;color:#ffffffda}.hint{font-size:12px;text-shadow:0 2px 5px #0008}.status{position:absolute;right:3%;top:3%;font-size:12px}.multiple .user{width:240px}.row{display:flex;align-items:center;gap:14px;margin:12px 0}.row .avatar{width:45px;height:45px;margin:0;font-size:20px}.multiple .password,.multiple .name,.multiple .user>.avatar,.multiple .hint{display:none}.rows{display:none}.multiple .rows{display:block}.failed .password{border-color:#ffafa4;background:#853a4a66}.failed .hint{color:#ffe1da}.exiting .date,.exiting .time,.exiting .user,.exiting .status{opacity:0;transition:opacity .24s}.desktop .date,.desktop .time,.desktop .user,.desktop .status{display:none}.bar,.dock{display:none}.desktop .bar{display:block;position:absolute;top:0;width:100%;padding:9px 18px;background:#f7faff44;color:#102340;font-size:13px}.desktop .dock{display:flex;position:absolute;bottom:2%;left:50%;transform:translateX(-50%);gap:12px;padding:12px;background:#fff5;border:1px solid #fff6;border-radius:22px}.dock span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#e8efff;color:#155a99}.label{position:absolute;left:18px;bottom:14px;font-size:12px;background:#102340b0;padding:7px;border-radius:6px}.notes{padding:20px 22px;max-width:1100px;line-height:1.6}</style><header><h1>KOS 独立登录界面：概念分镜</h1><p>离线视觉示意，非 macOS Tahoe 原版测量；字体、玻璃、时长均未达到 1:1。示例不进行认证。</p></header><nav><button data-state="single" class="active">单用户</button><button data-state="multiple">多用户</button><button data-state="failed">认证失败</button><button data-state="exiting">登录退场</button><button data-state="desktop">桌面入场完成</button></nav><main class="screen single" id="scene"><div class="status">输入源 · 网络 · 电源（示意）</div><div class="date">10月11日 星期日</div><div class="time">10:26</div><div class="user"><div class="avatar">K</div><div class="name">KOS 用户</div><div class="password">密码字段占位 · 无输入能力</div><div class="hint" id="hint">输入密码以登录</div><div class="rows"><div class="row"><div class="avatar">K</div>KOS 用户</div><div class="row"><div class="avatar">G</div>第二位用户</div><div class="row"><div class="avatar">＋</div>其他用户</div></div></div><div class="bar">KOS　 桌面　　　　　　　　　　　　　　　　网络　电源　10:26</div><div class="dock"><span>⌘</span><span>▣</span><span>◉</span><span>⚙</span></div><div class="label">概念示意 · 背景由 KOS 管线提供</div></main><div class="notes" id="notes">单用户：日期/时钟在上，用户区域靠下；需由实机基准最终校准。背景为本机研究样本，若不可用则显示渐变回退。</div><script>const text={single:'单用户：日期/时钟在上，用户区域靠下；需由实机基准最终校准。',multiple:'多用户：纵向头像与名字列表，保留其他用户。选择用户不立即改变显示模式。',failed:'失败：保持登录画面，提示并允许重试；敏感数据应清除。失败动效尚待原版参考。',exiting:'退场：建议约 240 ms 淡出 UI，留下纯背景后才 launch。此示意不模拟 DRM 交接，也不保证零黑帧。',desktop:'入场完成：用户 KWin 上 Cover 与完整 KOS 并行；背景匹配和必要组件就绪后撤罩，顶栏/Dock统一显露。'};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('scene').className='screen '+b.dataset.state;document.getElementById('hint').textContent=b.dataset.state==='failed'?'认证失败，请重试':'输入密码以登录';document.getElementById('notes').textContent=text[b.dataset.state];});</script></html>
