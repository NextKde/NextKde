<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740"><rect width="1400" height="740" fill="#101826"/><style>text{font-family:sans-serif;fill:#e5efff} .h{font-size:30px}.t{font-size:19px}.n{font-size:16px} rect.box{fill:#263c58;stroke:#70baff;stroke-width:2}</style><text x="40" y="52" class="h">KOS 登录 → 桌面交接（概念示意，非 Tahoe 测量）</text><text x="40" y="88" class="n">认证交给 greetd；QML 不能保证两个 KWin 之间无黑帧</text><g class="t"><rect class="box" x="40" y="130" width="290" height="160" rx="16"/><text x="60" y="167">登录 KWin + Greeter</text><text x="60" y="205">认证成功 → UI 淡出</text><text x="60" y="245">末帧：纯 KOS 壁纸</text><rect class="box" x="390" y="130" width="280" height="160" rx="16"/><text x="410" y="167">greetd launch</text><text x="410" y="205">登录会话退出</text><text x="410" y="245">才启动用户会话</text><rect x="730" y="130" width="250" height="160" rx="16" fill="#794127"/><text x="750" y="167">DRM / VT 交接</text><text x="750" y="205">可能空白 / 重新训练</text><text x="750" y="245">需要录像量化</text><rect class="box" x="1040" y="130" width="320" height="160" rx="16"/><text x="1060" y="167">用户 KWin 接管</text><text x="1060" y="205">轻量 Cover 显示同背景</text><text x="1060" y="245">与 Plasma / KOS 并行</text></g><g stroke="#9dccff" stroke-width="4"><path d="M330 210H382M670 210H722M980 210H1032"/></g><rect class="box" x="40" y="360" width="620" height="200" rx="16"/><text x="65" y="402" class="t">交接描述：展示数据，不含认证秘密</text><text x="65" y="445" class="t">资源 hash / crop / fit / 输出模式 / scale / phase</text><text x="65" y="488" class="t">wrapper 校验 → 会话 runtime 0600 → 消费清理</text><rect class="box" x="730" y="360" width="630" height="200" rx="16"/><text x="755" y="402" class="t">桌面揭幕门槛</text><text x="755" y="445" class="t">背景匹配 + 输出稳定 + 顶栏/Dock 必要状态</text><text x="755" y="488" class="t">Cover 渐隐，统一显露；超时必须可恢复</text><text x="40" y="630" class="t">ReadyToLaunch ≠ 桌面就绪；launched ≠ 首帧；资源 ready ≠ scanout</text><text x="40" y="680" class="t">静态壁纸优先验证；动态 phase 不能恢复所有 GPU 模拟状态</text></svg>
